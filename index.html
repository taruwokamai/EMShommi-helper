<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rumah Sakit Hommi — Data Staff</title>
<style>
:root{
  --bg:#1a0000; --cbg:#2b0a0a; --txt:#fff;
  --ac:#ffcc00; --ok:#28a745; --err:#ff3333;
  --btn:#330f0f; --btnh:#4d1818; --brd:#8b0000;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);
  padding:20px;line-height:1.6;
}
.container{max-width:1100px;margin:0 auto}
h1{color:var(--ac);margin-bottom:20px}
.back{
  background:var(--btn);color:var(--ac);border:1px solid var(--ac);
  padding:8px 16px;border-radius:6px;cursor:pointer;
  font-weight:700;margin-bottom:20px
}
.back:hover{background:var(--btnh)}
.pass-box{margin-bottom:20px}
.inp{
  width:100%;max-width:400px;padding:10px;background:#111;
  border:1px solid var(--brd);border-radius:6px;color:#fff;
  margin:6px 0
}
.btn{
  background:var(--ac);color:#000;border:none;padding:10px 18px;
  border-radius:6px;font-weight:700;cursor:pointer;margin:4px
}
.btn:hover{background:#ffd333}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:4px 8px;font-size:11px;margin:2px;border-radius:4px}
.btn-up{background:var(--ok);color:#fff}
.btn-dn{background:var(--ac);color:#000}
.btn-del{background:var(--err);color:#fff}
.grid-form{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin-bottom:20px
}
label{font-weight:700;color:var(--ac);font-size:13px}
table{width:100%;border-collapse:collapse;margin:15px 0}
th,td{
  padding:10px 8px;text-align:left;border-bottom:1px solid #442222;
  font-size:13px
}
th{background:var(--btn);color:var(--ac)}
.group-head{
  background:#2a1500;color:var(--ac);font-weight:700;
  padding:10px;border-radius:6px;margin-top:20px
}
.tag{
  padding:2px 6px;border-radius:4px;font-weight:700;font-size:11px
}
.m{background:#b91e1e;color:#fff}
.md{background:#00887a;color:#fff}
.t{background:#666;color:#fff}
.n{background:#333;color:#fff;border:1px solid #555}
.aktif{background:#28a745;color:#fff}
.resign{background:#444;color:#fff}
.msg{margin:10px 0;font-weight:700}
.ok-msg{color:var(--ok)}
.err-msg{color:var(--err)}
</style>
</head>
<body>
<div class="container">
  <button class="back" onclick="location.reload()">⬅ Kembali</button>
  <h1>👥 Data Staff Rumah Sakit Hommi</h1>

  <div class="pass-box">
    <label>Kata Sandi Admin:</label><br>
    <input type="password" id="pw" class="inp" placeholder="Masukkan sandi...">
    <button class="btn" onclick="login()">🔓 Buka Akses</button>
    <span id="msg-pass" class="msg"></span>
  </div>

  <div id="form-area" style="opacity:.4;pointer-events:none">
    <div class="grid-form">
      <div><label>BATCH</label><input type="text" id="f-batch" class="inp" placeholder="001"></div>
      <div><label>NAMA LENGKAP</label><input type="text" id="f-nama" class="inp" placeholder="Nama"></div>
      <div><label>JABATAN</label>
        <select id="f-jabatan" class="inp">
          <option value="">— Pilih —</option>
          <option value="CEO">CEO</option>
          <option value="Direktur">Direktur</option>
          <option value="Wakil Direktur">Wakil Direktur</option>
          <option value="Sekben">Sekben</option>
          <option value="Kabid Komdis">Kabid Komdis</option>
          <option value="Komdis">Komdis</option>
          <option value="Kabid HRD">Kabid HRD</option>
          <option value="HRD">HRD</option>
          <option value="Manajemen Lab">Manajemen Lab</option>
          <option value="Dokter Spesialis">Dokter Spesialis</option>
          <option value="Dokter Umum">Dokter Umum</option>
          <option value="Co Ass">Co Ass</option>
          <option value="Trainee">Trainee</option>
          <option value="Resign">Resign</option>
          <option value="PTHD">PTHD</option>
        </select>
      </div>
      <div><label>STATUS</label>
        <select id="f-status" class="inp">
          <option value="">— Pilih —</option>
          <option value="Aktif">Aktif</option>
          <option value="Tidak Aktif">Tidak Aktif</option>
          <option value="Resign">Resign</option>
          <option value="PTHD">PTHD</option>
        </select>
      </div>
      <div><label>JENIS KELAMIN</label>
        <select id="f-jk" class="inp">
          <option value="">— Pilih —</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div><label>NO. HP</label><input type="text" id="f-hp" class="inp" placeholder="08xx"></div>
      <div><label>CID</label><input type="text" id="f-cid" class="inp" placeholder="Kode"></div>
      <div><label>KETERANGAN</label><input type="text" id="f-ket" class="inp" placeholder="-"></div>
    </div>
    <button class="btn" onclick="tambah()">➕ Tambah Staff</button>
    <button class="btn" onclick="copyAll()">📋 Copy Discord</button>
    <span id="msg-form" class="msg"></span>
  </div>

  <div id="list-area"></div>
</div>

<script>
const SANDI = 'EMShommioyeoye';
let admin = false;
let data = [];

function simpan(){
  localStorage.setItem('rs-staff', JSON.stringify(data));
}
function muat(){
  const d = localStorage.getItem('rs-staff');
  if(d) data = JSON.parse(d);
}
muat();

function login(){
  if(document.getElementById('pw').value === SANDI){
    admin = true;
    document.getElementById('form-area').style.opacity = '1';
    document.getElementById('form-area').style.pointerEvents = 'auto';
    msg('msg-pass', '✅ Akses dibuka!', true);
    render();
  }else{
    msg('msg-pass', '❌ Sandi salah!', false);
  }
}

function getGrup(j){
  const manajemen = ['CEO','Direktur','Wakil Direktur','Sekben','Kabid Komdis','Komdis','Kabid HRD','HRD','Manajemen Lab'];
  const medis = ['Dokter Spesialis','Dokter Umum','Co Ass'];
  if(manajemen.includes(j)) return {id:'m', nama:'👔 DIREKSI & MANAJEMEN', cls:'m'};
  if(medis.includes(j)) return {id:'md', nama:'⚕️ STAFF MEDIS', cls:'md'};
  if(j==='Trainee') return {id:'t', nama:'🎓 TRAINEE', cls:'t'};
  return {id:'n', nama:'📋 RESIGN / PTHD', cls:'n'};
}

function tambah(){
  const batch = document.getElementById('f-batch').value.trim();
  const nama = document.getElementById('f-nama').value.trim();
  const jabatan = document.getElementById('f-jabatan').value;
  const status = document.getElementById('f-status').value;
  const jk = document.getElementById('f-jk').value;
  const hp = document.getElementById('f-hp').value.trim();
  const cid = document.getElementById('f-cid').value.trim();
  const ket = document.getElementById('f-ket').value.trim() || '-';

  if(!batch || !nama || !jabatan || !status || !jk){
    msg('msg-form', '❌ Lengkapi semua kolom wajib!', false);
    return;
  }

  data.push({batch, nama, jabatan, status, jk, hp, cid, ket});
  simpan(); render();

  // reset form
  ['batch','nama','jabatan','status','jk','hp','cid','ket'].forEach(id=>{
    document.getElementById('f-'+id).value = '';
  });
  msg('msg-form', '✅ Berhasil ditambahkan!', true);
}

function naik(i){
  if(i<=0) return;
  [data[i-1], data[i]] = [data[i], data[i-1]];
  simpan(); render();
}
function turun(i){
  if(i>=data.length-1) return;
  [data[i], data[i+1]] = [data[i+1], data[i]];
  simpan(); render();
}
function hapus(i){
  if(confirm('Yakin hapus?')){
    data.splice(i,1);
    simpan(); render();
  }
}

function render(){
  const area = document.getElementById('list-area');
  area.innerHTML = '';

  const grup = {
    m: data.filter(d=>getGrup(d.jabatan).id==='m'),
    md: data.filter(d=>getGrup(d.jabatan).id==='md'),
    t: data.filter(d=>getGrup(d.jabatan).id==='t'),
    n: data.filter(d=>getGrup(d.jabatan).id==='n')
  };

  Object.entries(grup).forEach(([key, list])=>{
    if(!list.length) return;
    const info = getGrup(list[0].jabatan);
    area.innerHTML += `<div class="group-head">${info.nama}</div>`;
    area.innerHTML += `
      <table>
        <tr>
          <th style="width:60px">Urutan</th>
          <th>BATCH</th>
          <th>NAMA</th>
          <th>JABATAN</th>
          <th>STATUS</th>
          <th>JK</th>
          <th>HP</th>
          <th>CID</th>
          <th>KETERANGAN</th>
          <th style="width:80px">Hapus</th>
        </tr>
        ${list.map(d=>{
          const idx = data.indexOf(d);
          return `
            <tr>
              <td>
                ${admin ? `
                  <button class="btn-sm btn-up" onclick="naik(${idx})">⬆</button>
                  <button class="btn-sm btn-dn" onclick="turun(${idx})">⬇</button>
                ` : ''}
              </td>
              <td>${d.batch}</td>
              <td>${d.nama}</td>
              <td><span class="tag ${getGrup(d.jabatan).cls}">${d.jabatan}</span></td>
              <td><span class="tag ${d.status==='Aktif'?'aktif':'resign'}">${d.status}</span></td>
              <td>${d.jk}</td>
              <td>${d.hp||'-'}</td>
              <td>${d.cid||'-'}</td>
              <td>${d.ket}</td>
              <td>${admin ? `<button class="btn-sm btn-del" onclick="hapus(${idx})">🗑</button>` : ''}</td>
            </tr>
          `;
        }).join('')}
      </table>
    `;
  });
}

function copyAll(){
  let txt = '```\n👥 DATA STAFF RS HOMMI\n';
  const grup = {
    '👔 DIREKSI & MANAJEMEN': data.filter(d=>getGrup(d.jabatan).id==='m'),
    '⚕️ STAFF MEDIS': data.filter(d=>getGrup(d.jabatan).id==='md'),
    '🎓 TRAINEE': data.filter(d=>getGrup(d.jabatan).id==='t'),
    '📋 RESIGN / PTHD': data.filter(d=>getGrup(d.jabatan).id==='n')
  };
  Object.entries(grup).forEach(([judul, list])=>{
    if(!list.length) return;
    txt += `\n${'═'.repeat(35)}\n${judul}\n${'═'.repeat(35)}\n`;
    list.forEach(d=>{
      txt += `BATCH: ${d.batch}\nNama: ${d.nama}\nJabatan: ${d.jabatan}\nStatus: ${d.status}\nJenis Kelamin: ${d.jk}\nHP: ${d.hp||'-'}\nCID: ${d.cid||'-'}\nKeterangan: ${d.ket}\n──────────────────────\n`;
    });
  });
  txt += '```';
  navigator.clipboard.writeText(txt).then(()=>{
    msg('msg-form', '✅ Disalin ke papan klip!', true);
  });
}

function msg(el, teks, ok){
  document.getElementById(el).innerText = teks;
  document.getElementById(el).className = `msg ${ok?'ok-msg':'err-msg'}`;
  setTimeout(()=>document.getElementById(el).innerText='', 3000);
}

render();
</script>
</body>
</html>
